name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[ocr,dev]"
      - name: Run tests
        # Tests that need the full World Bank database are skipped here; run `make data && make test` locally.
        run: pytest -q
