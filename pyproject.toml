[project]
name = "fairsend"
version = "0.1.0"
description = "Remittance cost comparison, hidden FX markup checker, and rate alerts built on World Bank Remittance Prices Worldwide data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rajiv Praveen" }]
requires-python = ">=3.10"
keywords = ["remittances", "exchange-rates", "fintech", "world-bank", "streamlit", "local-llm"]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0", "pypdf>=4.0", "pypdfium2>=4.0"]
rag = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
orchestration = ["dagster>=1.8"]
dev = ["pytest>=8.0", "fpdf2>=2.7"]

[project.urls]
Repository = "https://github.com/RajivPraveen/fairsend"

[project.scripts]
fairsend = "fairsend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fairsend*"]

[tool.setuptools.package-data]
fairsend = ["sql/*.sql", "explainer/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet access",
    "llm: test needs a running Ollama server",
    "ocr: test needs the tesseract binary",
]
